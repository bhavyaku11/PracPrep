name: CI Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce least privilege: read-only access to repository contents
permissions:
  contents: read

# Concurrency group cancels previous in-flight runs on the same branch for PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. Backend Unit, Route & Lifecycle Tests
  # ============================================================================
  backend-unit:
    name: Backend Unit & Route Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install system libraries (OCR & PDF extraction)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Python syntax and compilation check
        run: |
          python -m py_compile $(find backend/app backend/tests -name "*.py")

      - name: Run backend unit and API tests
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -m "not integration" -v --junitxml=backend-test-results.xml

      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results
          path: backend-test-results.xml
          if-no-files-found: ignore

  # ============================================================================
  # 2. PostgreSQL 16 Real Integration Tests
  # ============================================================================
  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_test
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: pracprep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres_test:postgres_test_password@localhost:5432/pracprep_test
          PYTHONPATH: backend
        run: |
          cd backend && alembic upgrade head

      - name: Execute PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres_test:postgres_test_password@localhost:5432/pracprep_test
          PYTHONPATH: backend
        run: |
          pytest backend/tests/integration -v --junitxml=postgres-integration-results.xml

      - name: Upload PostgreSQL integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-integration-results
          path: postgres-integration-results.xml
          if-no-files-found: ignore

  # ============================================================================
  # 3. Frontend Lint, Test & Production Build
  # ============================================================================
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend linter
        run: npm run lint

      - name: Run frontend test suite
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  # ============================================================================
  # 4. Docker Multi-Stage Build & Compose Validation
  # ============================================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -t pracprep-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t pracprep-frontend:ci .

  # ============================================================================
  # 5. Quality Gate
  # ============================================================================
  ci-quality-gate:
    name: CI Quality Gate
    needs: [backend-unit, postgres-integration, frontend, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate CI job results
        run: |
          echo "Evaluating pipeline quality gate status..."
          FAILED=0
          if [ "${{ needs.backend-unit.result }}" != "success" ]; then
            echo "::error::Job 'backend-unit' did not succeed (status: ${{ needs.backend-unit.result }})"
            FAILED=1
          fi
          if [ "${{ needs.postgres-integration.result }}" != "success" ]; then
            echo "::error::Job 'postgres-integration' did not succeed (status: ${{ needs.postgres-integration.result }})"
            FAILED=1
          fi
          if [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::Job 'frontend' did not succeed (status: ${{ needs.frontend.result }})"
            FAILED=1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "::error::Job 'docker-build' did not succeed (status: ${{ needs.docker-build.result }})"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "One or more CI jobs failed. Quality gate failed."
            exit 1
          fi

          echo "All CI quality gates passed successfully! Code is verified."
