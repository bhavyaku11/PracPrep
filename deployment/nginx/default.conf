# ==============================================================================
# PracPrep Nginx Configuration
# Serves React SPA static build & reverse proxies /api/ traffic to FastAPI backend
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Maximum allowed payload size for lab manual uploads (PDF and DOCX)
    client_max_body_size 25M;

    # Static assets root directory compiled from React / Vite
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text, scripts, stylesheets, and json
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache immutable Vite static chunks (JS/CSS/hashed images) for 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Reverse proxy /api/ requests to the FastAPI backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Proxy backend healthcheck endpoint directly
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy interactive API documentation in non-production environments
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback: deliver index.html on direct URL refresh or navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
