# Alembic Configuration for PracPrep

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Prepend current directory to sys.path
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Timezone for generated migration timestamps
timezone = UTC

# Database URL is overridden dynamically in alembic/env.py via app.core.config.settings
sqlalchemy.url = 

[post_write_hooks]
# Post write hooks can be added here (e.g. black, ruff)

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
